name: Aniob Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  preflight-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run CI Preflight Guards
        run: |
          chmod +x scripts/*.sh
          bash scripts/ci-preflight.sh

      - name: Verify release signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "KEYSTORE_PATH=release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}" >> $GITHUB_ENV
          elif [ -n "$KEYSTORE_PATH" ] && [ -f "$KEYSTORE_PATH" ]; then
            echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}" >> $GITHUB_ENV
          else
            echo "ERROR: Real release signing secrets (KEYSTORE_BASE64 or KEYSTORE_PATH, STORE_PASSWORD, KEY_ALIAS) are missing. Refusing to sign release APK with public debug key."
            exit 1
          fi

      - name: Build Android Release APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee build.log

      # Failure diagnostics: the Actions log archive is not always reachable outside GitHub, so a
      # failed build publishes the compiler/Gradle errors as a commit comment on the tagged commit.
      - name: Publish build failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f build.log ]; then
            echo "no build.log captured; nothing to publish"
            exit 0
          fi
          {
            printf 'Release build failed for %s at %s\n\n' "${{ github.ref_name }}" "${{ github.sha }}"
            printf 'errors\n------\n'
            grep -E '^(e: |FAILURE:|> Task .*FAILED|Caused by:|[[:space:]]*\* What went wrong:|[[:space:]]*\* Try:)' build.log | head -80
            printf '\nlog tail\n--------\n'
            tail -100 build.log
          } > /tmp/build-report.md 2>&1
          head -c 60000 /tmp/build-report.md > /tmp/build-report-clipped.md
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            --input <(jq -Rs '{body: .}' /tmp/build-report-clipped.md) > /dev/null \
            && echo "diagnostics published as a commit comment" \
            || echo "could not publish diagnostics"

      - name: Generate Checksum (SHA-256)
        run: |
          mkdir -p release_artifacts
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release_artifacts/ \;
          cd release_artifacts
          sha256sum *.apk > checksums.txt
          cat checksums.txt

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aniob-release-apk
          path: release_artifacts/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
