name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# CI only reads source and uploads reports; never expose write permissions to fork PRs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Preflight guards
        run: |
          chmod +x scripts/*.sh
          bash scripts/ci-preflight.sh
      - name: Generate debug signing key
        run: keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Unit tests (core-agent + app)
        run: |
          set -o pipefail
          if ./gradlew :core-agent:test :app:testDebugUnitTest --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/unit-tests.log"; then
            exit 0
          fi
          # Surface actionable failures through the Checks API as well as downloadable logs.
          # The tests and their exit status remain mandatory; annotations never turn failure green.
          python3 - "$RUNNER_TEMP/unit-tests.log" <<'PY'
          import glob, re, sys, xml.etree.ElementTree as ET
          def annotate(message):
              message = message[:3000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Unit test diagnostics::{message}')
          lines = open(sys.argv[1], encoding='utf-8', errors='replace').read().splitlines()
          compiler = [line for line in lines if re.search(r'^e:|^ERROR:|error:', line)]
          failures = [line for line in lines if re.search(r' FAILED|^> (?!Task)|^Execution failed|^Caused by:', line)]
          diagnostics = compiler + failures + lines[-60:]
          if not diagnostics:
              annotate('\n'.join(lines[-40:]))
          # One annotation per ~2,800 characters: a step may publish only a few annotations,
          # so packing lines keeps a long compiler report readable from the Checks API.
          chunk = ''
          chunks = []
          for line in diagnostics[:400]:
              line = line[:400]
              if chunk and len(chunk) + len(line) + 1 > 2800:
                  chunks.append(chunk)
                  chunk = ''
              chunk = line if not chunk else chunk + '\n' + line
          if chunk:
              chunks.append(chunk)
          for chunk in chunks[:8]:
              annotate(chunk)
          for path in sorted(glob.glob('**/build/test-results/test*/TEST-*.xml', recursive=True)):
              root = ET.parse(path).getroot()
              for case in root.iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      annotate(f"{case.get('classname')}: {case.get('name')}: {failure.get('message') or failure.text or 'failed'}")
          PY
          exit 1
      - name: Android lint
        run: ./gradlew :app:lintDebug --console=plain
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-debug.html
          if-no-files-found: ignore
