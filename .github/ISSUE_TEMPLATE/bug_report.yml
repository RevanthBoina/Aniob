name: Bug report
description: Report a reproducible problem in Aniob.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: What happened, and how can we reproduce it?
      description: Include only the steps and details needed to see the issue. Remove personal data and secrets.
      placeholder: Steps, expected result, and actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: App version and Android version (if known)
      placeholder: e.g. 1.0.4, Android 15
    validations:
      required: false
